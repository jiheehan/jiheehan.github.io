# Theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# Site
locale: "en-US"
title: "Jihee Han"
title_separator: "-"
subtitle: "Autonomous Systems, 3D Vision & Machine Learning"
name: "Jihee Han"
description: >
  Autonomous systems and machine learning engineer with seven years of
  industry experience in autonomous-driving perception, 3D vision,
  learning-based autonomy, and real-world ML systems.
url: "https://jiheehan.github.io"
baseurl: ""
repository: "jiheehan/jiheehan.github.io"
masthead_title: "Jihee Han"

# Search
search: false

# Social profiles for SEO
social:
  type: Person
  name: "Jihee Han"
  links:
    - "https://github.com/jiheehan"
    - "https://www.linkedin.com/in/jihee-han-410459212"

# Author profile
author:
  name: "Jihee Han"
  avatar: "/assets/images/han.jpg"
  bio: >
    Master's student in Autonomy and Robotics at UIUC with seven years of
    industry experience in autonomous-driving perception and learning-based
    autonomy at Hyundai Motor Company.
  location: "Champaign, IL"
  email: "jiheeh2@illinois.edu"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:jiheeh2@illinois.edu"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jihee-han-410459212"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jiheehan"

# Footer
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jihee-han-410459212"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jiheehan"

# Files
include:
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Output
permalink: /:categories/:title/
timezone: America/Chicago

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false